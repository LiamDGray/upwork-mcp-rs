[package]
name = "upwork-mcp-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "High-assurance CLI and supervisor gateway for Upwork MCP"

[[bin]]
name = "upwork-mcp-rs"
path = "src/main.rs"

[lib]
name = "upwork_mcp_cli"
path = "src/lib.rs"

[dependencies]
upwork-mcp-core = { path = "../upwork-mcp-core", version = "0.1.0" }
upwork-mcp-server = { path = "../upwork-mcp-server", version = "0.1.0" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
colored = "2.2"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
