[package]
name = "upwork-mcp-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core domain logic, zero-copy audit trail, affine safety typestates, and token distillation for Upwork MCP"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
zerocopy = { version = "0.8", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

[dev-dependencies]
proptest = "1.4"
